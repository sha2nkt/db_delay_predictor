[project]
name = "db-delay-predictor"
version = "0.1.0"
description = "bahn.com-style connection search with 7-day historical delay stats"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # [standard] pulls uvloop + httptools, replacing the pure-Python asyncio loop and
    # h11 parser; run `uv sync` on deploy to pick them up
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "lxml>=5.0",
    "huggingface-hub>=0.26",
    "curl-cffi>=0.15.0",
    "gtfs-realtime-bindings>=2.1.0",
    "brotli>=1.2.0",
    "firebase-admin>=7.5.0",
]

[dependency-groups]
# async tests run on anyio's pytest plugin, which fastapi already pulls in
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
