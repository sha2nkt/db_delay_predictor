[project]
name = "db-delay-predictor"
version = "0.1.0"
description = "bahn.com-style connection search with 7-day historical delay stats"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "lxml>=5.0",
    "huggingface-hub>=0.26",
]
