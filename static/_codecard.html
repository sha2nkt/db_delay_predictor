<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/style.css?v=92"></head>
<body><main class="login-main"><section id="email-code-card" class="login-card auth-modal">
    <h2 data-i18n="inboxHeading">Sieh in dein Postfach</h2>
    <p class="auth-lead" id="email-code-sent">Gib den Bestätigungscode ein, den wir gerade an shashank.tripathi123@yahoo.co.in geschickt haben.</p>
    <form id="email-code-form" class="auth-form">
      <div class="field">
        <label for="email-code-input" class="visually-hidden" data-i18n="codeLabel">Code</label>
        <input id="email-code-input" class="code-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" spellcheck="false" data-i18n-placeholder="codeLabel" placeholder="Code">
      </div>
      <button type="submit" class="search-btn auth-primary" data-i18n="continue">Weiter</button>
      <p id="email-code-status" class="auth-status" role="status"></p>
    </form>
    <!-- label and disabled state are the countdown; login.js owns both -->
    <button type="button" id="resend-btn" class="link-btn auth-resend" disabled>Erneut senden in 49 s</button>
    <div class="auth-or"><span data-i18n="or">ODER</span></div>
    <button type="button" id="to-password" class="sso-btn" data-i18n="withPassword">Weiter mit Passwort</button>
    <p class="auth-switch"><button type="button" class="link-btn to-choose" data-i18n="otherEmail">Andere E-Mail-Adresse</button></p>
  </section></main></body></html>
