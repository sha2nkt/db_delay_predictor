<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="/style.css?v=92"></head>
<body><main class="login-main"><section id="password-card" class="login-card auth-modal">
    <h2 data-i18n="passwordHeading">Passwort eingeben</h2>
    <form id="password-form" class="auth-form">
      <div class="field">
        <label for="password-username" data-i18n="email">E-Mail-Adresse</label>
        <!-- readonly rather than hidden: password managers pair a password
             with the username field of the same form, and showing which
             address is being signed into is the point of this row -->
        <div class="input-row">
          <input id="password-username" type="email" autocomplete="username" readonly value="shashank.tripathi123@yahoo.co.in">
          <button type="button" id="change-email" class="link-btn" data-i18n="editEmail">Ändern</button>
        </div>
      </div>
      <div class="field">
        <label for="password-input" class="visually-hidden" data-i18n="password">Passwort</label>
        <div class="input-row">
          <input id="password-input" type="password" minlength="8" maxlength="200" required autocomplete="current-password" data-i18n-placeholder="password" placeholder="Passwort">
          <button type="button" id="pw-toggle" class="pw-toggle" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
              <line id="pw-slash" x1="4" y1="20" x2="20" y2="4" class="hidden"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="button" id="forgot-btn" class="link-btn pw-forgot" data-i18n="forgotBtn">Passwort vergessen?</button>
      <button type="submit" class="search-btn auth-primary" data-i18n="continue">Weiter</button>
      <p id="password-status" class="auth-status" role="status"></p>
    </form>
    <div class="auth-or"><span data-i18n="or">ODER</span></div>
    <button type="button" id="back-to-code" class="sso-btn" data-i18n="withCode">Mit Einmalcode anmelden</button>
  </section></main></body></html>
